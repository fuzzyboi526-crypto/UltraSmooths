
name: Build UltraSmooth

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract project
        run: unzip -o UltraSmooth-1.21.11-starter.zip

      - name: Build mod
        working-directory: UltraSmooth-1.21.11
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: UltraSmooth-JAR
          path: UltraSmooth-1.21.11/build/libs/*.jar
          
